<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title>Business Card – S. Ricardo Dovonou</title>
</head>
<body>
    <article class="business-card" aria-label="Carte de visite de S. Ricardo Dovonou">

        <div class="card-top">
            <div class="card-deco" aria-hidden="true"></div>
            <img src="https://github.com/DocariDR.png" alt="Photo de profil de S. Ricardo Dovonou" class="profile-image">
            <h1 class="full-name">S. Ricardo Dovonou</h1>
            <p class="designation">Learning Web</p>
            <p class="company">freeCodeCamp</p>
        </div>

        <div class="card-body">

            <div class="contact-list" role="list">
                <a href="mailto:ricardovonoupro@gmail.com" class="contact-item" role="listitem">
                    <span class="contact-icon" aria-hidden="true">✉</span>
                    <span class="contact-text">ricardovonoupro@gmail.com</span>
                </a>
                <a href="tel:+010000000000" class="contact-item" role="listitem">
                    <span class="contact-icon" aria-hidden="true">☎</span>
                    <span class="contact-text">01 000 000 0000</span>
                </a>
            </div>

            <div class="divider" aria-hidden="true"></div>

            <p class="social-label">Me retrouver sur</p>
            <ul class="social-links">
                <li>
                    <a href="https://x.com/DocariDR" class="social-link" aria-label="Twitter de S. Ricardo Dovonou">Twitter</a>
                </li>
                <li>
                    <a href="https://www.linkedin.com/in/ricardo-dovonou" class="social-link" aria-label="LinkedIn de S. Ricardo Dovonou">LinkedIn</a>
                </li>
                <li>
                    <a href="https://github.com/DocariDR" class="social-link" aria-label="GitHub de S. Ricardo Dovonou">GitHub</a>
                </li>
            </ul>

            <a href="https://github.com/DocariDR" class="portfolio-btn" aria-label="Voir le portfolio de S. Ricardo Dovonou">
                Voir le portfolio →
            </a>

        </div>
    </article>
</body>
</html>
